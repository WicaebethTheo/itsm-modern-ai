# ITSM Modern AI — stack pull-only (Portainer / orchestrateur) : moteur + PostgreSQL.
# Portainer : Stacks > Add stack > coller > Deploy. Aucune variable obligatoire.
# Puis ouvrez http://<hôte>:8000 : le premier écran crée le compte administrateur
# (email + mot de passe). ⚠️ Tant que ce compte n'existe pas, l'instance est REVENDICABLE
# par quiconque atteint le port — ne l'exposez pas publiquement avant de l'avoir créé.
# NE JAMAIS faire `down -v` : cela supprime itsm_data (master.key) ET itsm_pgdata (la base).
services:
  itsm:
    # Tag PARAMÉTRABLE. Défaut `latest` — assumé pour la voie « coller le stack et
    # déployer » : c'est le seul tag qui reste juste dans un YAML copié dans un wiki,
    # un ticket ou une capture d'écran, et la mise à jour se fait explicitement
    # (Portainer > Pull and redeploy). Épingler une version = définir ITSM_IMAGE_TAG
    # (ex. 0.9.47) dans les variables du stack : recommandé dès qu'on veut des mises à
    # jour maîtrisées. Les tags semver X.Y.Z et X.Y sont publiés par docker-publish.yml.
    image: ghcr.io/wicaebeththeo/itsm-modern-ai:${ITSM_IMAGE_TAG:-latest}
    container_name: itsm-modern-ai
    restart: unless-stopped
    # La base n'est plus optionnelle : le moteur ne démarre pas sans elle. `service_healthy`
    # (et pas `service_started`) car un conteneur postgres qui vient de démarrer n'accepte
    # pas encore les connexions.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}     # false = login OK en HTTP ; true derrière un proxy TLS
      # ⚠️ COHÉRENCE : ce défaut porte le couple itsm/itsm. Définir POSTGRES_USER /
      # POSTGRES_PASSWORD dans les variables du stack OBLIGE à définir aussi
      # ITSM_DATABASE_URL avec les mêmes valeurs, sinon le moteur ne se connecte plus à sa
      # propre base. (Ces variables ne servent qu'à l'INITIALISATION du cluster : les
      # changer après le 1er boot n'a aucun effet sans `ALTER USER`.)
      DATABASE_URL: ${ITSM_DATABASE_URL:-postgresql+psycopg://itsm:itsm@postgres:5432/itsm}
      LICENSE_KEY: ${LICENSE_KEY:-}                         # vide = Community
    ports:
      - "${ITSM_HOST_PORT:-8000}:8000"
    volumes:
      - itsm_data:/app/data
    # Durcissement : non-root, caps minimales (chown/gosu du volume au boot), FS read-only.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]
    read_only: true
    tmpfs: ["/tmp"]
    # Sonde de VIVACITÉ uniquement (processus + base) : /health/live ne fait AUCUN appel
    # sortant. L'ancienne sonde `/health?probe=true` interrogeait GLPI ET le fournisseur
    # LLM toutes les 30 s (~2 880 sessions GLPI + 2 880 appels sortants/jour) et rendait
    # le conteneur `unhealthy` sur un incident FOURNISSEUR — inoffensif sous compose,
    # destructeur sous Swarm/k8s/autoheal (redémarrages en boucle d'un moteur SAIN).
    # L'état GLPI/LLM reste consultable dans la console (/health, /api/status).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Bornage CPU/mémoire — aligné sur docker-compose.yml (anti-emballement sur hôte
    # mutualisé). Compose v2 applique `deploy.resources.limits` hors Swarm.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    # Rotation des logs OBLIGATOIRE : sans elle, le driver json-file par défaut est
    # NON borné et remplit le disque en quelques mois. Disque plein = la base ne peut
    # plus écrire → le plafond de coût LLM ne peut plus être comptabilisé.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL — SEULE base supportée, donc service à part entière de la stack.
  #
  # ############################################################################
  # #  ATTENTION — NE JAMAIS CHANGER LE CHIFFRE MAJEUR DE CE TAG A LA LEGERE.  #
  # ############################################################################
  # Le tag reste volontairement sur la majeure 17 (le suffixe `17-alpine` continue de
  # recevoir les correctifs mineurs/sécurité ; PG 17 est supporté jusqu'en 2029).
  # Passer à 18/19/... N'EST PAS un simple bump d'image, pour TROIS raisons :
  #
  #   1) FORMAT DES DONNÉES. Les fichiers d'un cluster PG 17 sont illisibles par une
  #      majeure supérieure : le conteneur refuse de démarrer sur un itsm_pgdata existant
  #      (« database files are incompatible with server ») et boucle en restart. Il faut
  #      DUMPER avant le bump, moteur arrêté :
  #        docker compose exec -T postgres pg_dump -U itsm -Fc itsm > avant-bump.dump
  #      … puis restaurer dans le nouveau cluster (`pg_restore -U itsm -d itsm --no-owner`).
  #      ⚠️ Sur cette voie, AUCUN garde automatique n'est possible : le PGDATA vit dans un
  #      volume nommé que le conteneur moteur ne monte pas (et il ne démarre de toute façon
  #      pas tant que la base n'est pas `healthy`). Le seul signal serait `itsm-postgres` en
  #      « restarting » avec « database files are incompatible with server » dans ses logs —
  #      d'où ce rappel ici, à l'endroit exact où l'on changerait le tag.
  #
  #   2) LE CLIENT DE L'IMAGE MOTEUR DOIT SUIVRE. L'image embarque `postgresql-client-17`,
  #      qui produit les sauvegardes (`python -m itsm_modern_ai.backup`). Un client d'une
  #      AUTRE majeure que ce serveur fabrique des archives que le couple restaurant ne
  #      sait pas relire — on ne le découvre que le jour de la restauration. Les deux
  #      majeures bougent ENSEMBLE (contrat testé : tests/unit/test_deployment_files.py).
  #
  #   3) PIÈGE PROPRE À PG 18+ : l'image officielle a DÉPLACÉ son PGDATA de
  #      /var/lib/postgresql/data vers /var/lib/postgresql/<major>/docker. Le montage
  #      ci-dessous deviendrait HORS-SUJET : PG initialiserait un cluster VIDE dans la
  #      couche écrivable du conteneur, le moteur démarrerait sur une base vide sans la
  #      moindre erreur, et tout serait perdu au prochain redéploiement. Un bump vers 18+
  #      impose donc AUSSI de changer la cible du montage en `/var/lib/postgresql`.
  postgres:
    image: postgres:17-alpine
    container_name: itsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsm}
      POSTGRES_DB: ${POSTGRES_DB:-itsm}
    # Volume NOMMÉ dédié : le PGDATA ne partage rien avec itsm_data (master.key). Deux
    # cycles de vie distincts, et surtout aucun risque que le chown du volume applicatif
    # (entrypoint du moteur) touche au cluster — PostgreSQL refuse de démarrer si son
    # PGDATA ne lui appartient pas.
    # Aucun `ports:` : la base n'est joignable que depuis le réseau du stack.
    volumes:
      - itsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itsm} -d ${POSTGRES_DB:-itsm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # La PREMIÈRE initialisation (initdb) prend quelques secondes : sans start_period,
      # ses échecs comptent dans `retries` et la base peut être marquée `unhealthy` avant
      # même d'avoir fini de naître — le moteur ne démarrerait alors jamais.
      start_period: 20s
    # Durcissement aligné sur le service `itsm` : pas d'escalade, et les SEULES capabilities
    # dont l'entrypoint officiel a besoin (chown/chmod du PGDATA au premier boot, puis
    # abandon des privilèges root vers l'utilisateur postgres). Pas de `read_only: true`
    # ici : PostgreSQL écrit hors de son PGDATA (socket, fichiers temporaires).
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
    # Bornage CPU/mémoire. Plus généreux que le moteur : PostgreSQL alloue shared_buffers
    # (128 Mo par défaut) PLUS work_mem par connexion, et un VACUUM sous 512 Mo se fait
    # tuer par l'OOM killer — une base tuée en pleine écriture est le pire des scénarios.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    # Rotation des logs OBLIGATOIRE : sans elle, json-file est NON borné. PostgreSQL logue
    # chaque checkpoint, chaque connexion refusée, chaque requête lente.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  itsm_data:
  itsm_pgdata:
