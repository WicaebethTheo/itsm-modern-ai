# Déploiement on-prem : un seul service + volume SQLite (pilote, pas de HA).
#
# PERSISTANCE DE LA CONFIG : toute la configuration (connexion GLPI, clés LLM,
# périmètre, etc.) vit dans ./data (base SQLite + master.key). Elle survit à
# `docker compose up`/`restart`/`build`. Elle n'est PERDUE que si :
#   - vous lancez `docker compose down -v` (le -v supprime le volume), ou
#   - le dossier ./data est supprimé/non persistant, ou
#   - MASTER_KEY change (les secrets chiffrés deviennent illisibles).
# → FIXEZ MASTER_KEY dans .env et ne faites jamais `down -v` en prod.
services:
  itsm:
    build: .
    image: itsm-modern-ai:latest
    container_name: itsm-modern-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # La DB et la master key vivent dans le volume monté.
      DATABASE_URL: sqlite:////app/data/itsm.db
    ports:
      - "8000:8000"
    volumes:
      # Persistance : base SQLite + master key. Les fiches techniciens, la clé LLM
      # et la connexion GLPI se configurent dans l'interface web (rien à monter).
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
