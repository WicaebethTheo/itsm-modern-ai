[project]
name = "itsm-modern-ai"
version = "0.9.85"
description = "Assistant IA de triage de tickets GLPI — moteur à garde-fous (pilote V1)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # ≥0.138 : `include_router()` n'aplatit plus les routes dans `app.routes`, et c'est
    # `fastapi.routing.iter_route_contexts()` (introduite en 0.138.0) qui redonne la vue
    # à plat. Utilisée par `api/metrics.py` (label `path` templaté) et `api/routes/debug.py`
    # (`/api/debug/info`) : en dessous, ces deux-là ne voient plus aucune route.
    "fastapi>=0.138",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "cryptography>=42.0",
    "pwdlib[argon2]>=0.2",
    "itsdangerous>=2.2",
    "prometheus-client>=0.20",
    # anyio : importé DIRECTEMENT (adapters/ssrf.py, services/triage.py) — on ne dépend
    # pas de sa seule présence transitive via starlette/httpx.
    "anyio>=4.4",
    # PostgreSQL est la SEULE base supportée : le driver psycopg 3 n'est plus un extra
    # optionnel, sans lui le moteur ne démarre pas.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itsm_modern_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

# ── Couverture ────────────────────────────────────────────────────────────────────
# `branch = true` : on mesure les BRANCHES, pas seulement les lignes. C'est plus sévère
# (88,0 % contre 90,0 % en lignes sur la même suite) et c'est le point : un `if` dont un
# seul côté est exercé compte comme couvert en mesure de lignes, alors que c'est exactement
# là que se cachent les régressions — un garde-fou dont on ne teste jamais le refus.
#
# Le seuil est un CLIQUET, pas un objectif : il est posé quelques points SOUS la
# couverture réelle (88,0 % de branches au moment de sa mise en place). Il n'a pas vocation à monter à
# chaque commit — son rôle est d'attraper la régression franche : du code métier ajouté
# sans test, ou une suite supprimée « en attendant ». Un seuil collé à la valeur courante
# casserait la CI au moindre refactor qui déplace trois lignes, et on finirait par le
# désactiver — un garde-fou qu'on contourne ne protège de rien.
[tool.coverage.run]
source = ["src/itsm_modern_ai"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    # Branches défensives non atteignables en test (le `...` des Protocol de `ports/`,
    # les gardes de typage) : les compter ferait baisser le taux sans qu'aucun test
    # supplémentaire ne soit possible ni souhaitable.
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008 : `Depends(...)` en valeur par défaut est l'idiome FastAPI.
ignore = ["B008"]
