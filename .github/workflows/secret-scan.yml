# Détection de secrets (gitleaks) — dépôt public, donc « fuite = fuite définitive ».
#
# Invariant du projet : AUCUN secret dans git (.env, data/, keys/*.hex sont gitignored,
# les PAT GitLab sont éphémères). Ce workflow est le filet automatique qui rend cet
# invariant vérifiable au lieu d'être seulement documenté : un `.env` commité par
# erreur, une clé Ed25519 de signature de licence collée dans un test, un PAT laissé
# dans un script — tout ça fait rougir la PR AVANT le merge.
#
# La configuration des règles vit dans `.gitleaks.toml` à la racine (jeu de règles
# gitleaks par défaut + allowlist chirurgicale des placeholders connus). Le binaire
# comme l'action le découvrent automatiquement à la racine du dépôt scanné.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  # Balayage hebdomadaire de l'historique complet : les règles gitleaks s'enrichissent
  # (nouveaux formats de jetons), et un secret ancien peut n'être reconnu qu'aujourd'hui.
  # Lundi 03:42 UTC — creux de charge, et volontairement décalé de codeql.yml pour ne
  # pas empiler trois runs planifiés sur le même créneau.
  schedule:
    - cron: "42 3 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Choix du moteur ─────────────────────────────────────────────────────────
  # `gitleaks/gitleaks-action` est gratuit pour les dépôts appartenant à un COMPTE
  # PERSONNEL, mais exige une variable GITLEAKS_LICENSE pour les dépôts appartenant à
  # une ORGANISATION. Aujourd'hui `WicaebethTheo/itsm-modern-ai` est bien un compte
  # personnel → l'action tourne gratuitement. Mais si le dépôt était un jour transféré
  # à une organisation, l'action se mettrait à échouer à CHAQUE run, sur tous les
  # commits, jusqu'à ce que quelqu'un aille demander une licence : un workflow rouge
  # en permanence est un workflow que plus personne ne lit.
  #
  # Ce job de garde évite ce scénario. Il choisit, à l'exécution :
  #   - `action`  : compte personnel, OU secret GITLEAKS_LICENSE présent ;
  #   - `binaire` : tout le reste (organisation sans licence, contexte indéterminé).
  # Le chemin `binaire` invoque directement la CLI gitleaks (MIT, aucune licence
  # requise, quel que soit le propriétaire) : il n'y a donc AUCUN cas où le scan
  # cesse silencieusement de tourner. On teste le secret dans un job dédié parce que
  # le contexte `secrets` n'est pas utilisable dans un `if:` au niveau job.
  moteur:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Ce job ne fait AUCUN checkout : il n'a besoin d'aucune permission sur le dépôt.
    permissions: {}
    outputs:
      choix: ${{ steps.decide.outputs.choix }}
    steps:
      - name: Déterminer le moteur gitleaks utilisable
        id: decide
        env:
          # Vide si le secret n'existe pas — c'est le cas nominal ici, et ce n'est
          # PAS une erreur : on ne dépend d'aucun secret inexistant.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # "User" ou "Organization". Absent d'un payload inattendu → chaîne vide,
          # et on retombe alors sur le binaire (choix « fail-safe » : on préfère un
          # moteur qui marche toujours à un moteur qui marche peut-être).
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -euo pipefail
          if [ "$OWNER_TYPE" = "User" ] || [ -n "${GITLEAKS_LICENSE:-}" ]; then
            echo "choix=action" >> "$GITHUB_OUTPUT"
            echo "Propriétaire='$OWNER_TYPE', licence fournie=$([ -n "${GITLEAKS_LICENSE:-}" ] && echo oui || echo non) → action officielle."
          else
            echo "choix=binaire" >> "$GITHUB_OUTPUT"
            echo "Propriétaire='$OWNER_TYPE' sans GITLEAKS_LICENSE → repli sur la CLI gitleaks (aucune licence requise)."
          fi

  # ── Chemin nominal : action officielle ──────────────────────────────────────
  gitleaks-action:
    needs: moteur
    if: needs.moteur.outputs.choix == 'action'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Lecture du code et de l'historique. Rien d'autre : voir GITLEAKS_ENABLE_COMMENTS
      # plus bas pour la raison pour laquelle on n'ouvre PAS `pull-requests: write`.
      contents: read
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          # PIÈGE N°1. Le checkout par défaut est superficiel (`fetch-depth: 1`) :
          # gitleaks ne verrait alors qu'un seul commit et rendrait un « no leaks
          # found » rassurant mais mensonger. Il faut l'historique :
          #   - sur `push` / `schedule`, pour scanner tout le passé (un secret retiré
          #     par un commit ultérieur reste présent dans les objets git) ;
          #   - sur `pull_request`, parce que l'action délimite la plage de commits de
          #     la PR (base..head) et a besoin des DEUX extrémités dans le clone local.
          # Le dépôt est petit (~135 commits, < 5 Mo) : `fetch-depth: 0` coûte
          # quelques secondes, largement moins qu'un angle mort.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Absent sur un compte personnel → variable vide, l'action n'en tient pas
          # compte. Aucune dépendance dure à un secret qui n'existe pas.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Chemin explicite plutôt que découverte implicite : si le fichier est
          # renommé ou déplacé, on veut un échec bruyant, pas un repli silencieux sur
          # les règles par défaut (qui rougirait sur les placeholders allowlistés).
          GITLEAKS_CONFIG: .gitleaks.toml
          # Commentaires de PR désactivés VOLONTAIREMENT : les publier exigerait
          # `pull-requests: write`, et sur un dépôt public les PR venant d'un fork
          # reçoivent de toute façon un GITHUB_TOKEN en lecture seule — l'action
          # échouerait sur l'appel API au lieu de rapporter la fuite. Le job rouge,
          # le résumé de job et l'artefact SARIF suffisent à alerter.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  # ── Chemin de repli : CLI gitleaks appelée directement ──────────────────────
  # Fonctionnellement équivalent (même binaire, même `.gitleaks.toml`), sans licence
  # ni jeton. Ne tourne que si le job `moteur` l'a désigné : les deux chemins ne
  # scannent donc jamais en double.
  gitleaks-binaire:
    needs: moteur
    if: needs.moteur.outputs.choix == 'binaire'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Version épinglée : `latest` ferait varier le jeu de règles d'un run à l'autre
      # et pourrait rendre rouge une PR qui ne touche à rien.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cf. PIÈGE N°1 ci-dessus.

      - name: Installer la CLI gitleaks (checksum vérifié)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "$base/$tarball"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Un outil de sécurité qu'on télécharge sans vérifier son empreinte serait
          # une ironie coûteuse : on valide le sha256 publié avec la release.
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        id: scan
        run: |
          set -uo pipefail
          # PIÈGE N°1 bis : ici c'est NOUS qui délimitons la plage.
          #   - pull_request : on ne scanne QUE les commits introduits par la PR
          #     (base..head). Scanner tout l'historique à chaque PR ferait rougir la
          #     PR d'un contributeur pour une fuite antérieure qu'il n'a pas commise.
          #   - push / schedule / dispatch : historique complet, c'est le filet global.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            plage="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            echo "Plage scannée : $plage"
            gitleaks git . --no-banner --redact \
              --config .gitleaks.toml \
              --log-opts "$plage" \
              --report-format sarif --report-path gitleaks.sarif
          else
            echo "Scan de l'historique complet."
            gitleaks git . --no-banner --redact \
              --config .gitleaks.toml \
              --report-format sarif --report-path gitleaks.sarif
          fi
          code=$?
          # `--redact` garantit que rien de sensible n'atterrit dans les logs publics
          # du run : on ne veut pas que le rapport de fuite soit lui-même la fuite.
          if [ "$code" -ne 0 ]; then
            echo "::error::gitleaks a détecté au moins un secret — voir l'artefact SARIF."
            echo "### 🔴 Secret détecté par gitleaks" >> "$GITHUB_STEP_SUMMARY"
            echo "Le rapport SARIF (valeurs masquées) est publié en artefact du run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Aucun secret détecté" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Publier le rapport SARIF
        # `always()` : c'est précisément quand le scan échoue qu'on veut le rapport.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
