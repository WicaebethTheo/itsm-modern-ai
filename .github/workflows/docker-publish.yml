# Publication de l'image conteneur sur GHCR (ghcr.io), multi-arch amd64 + arm64.
# C'est l'image PUBLIQUE consommee par le deploiement orchestrateur (Portainer,
# docker run, one-liner curl|bash) et par docker-compose.portainer.yml.
#
# Declencheurs et TAGS — `main` ne deplace PLUS `latest` :
#   - push sur `main`              -> `edge` + `sha-<court>` (etat de developpement) ;
#   - release publiee (tag vX.Y.Z) -> `X.Y.Z`, `X.Y`, et `latest`.
#
# POURQUOI ce decouplage (change en 0.9.54). `latest` est ce que tire tout exploitant qui
# fait `docker compose pull` : tant qu'il suivait `main`, chaque merge partait directement
# en production chez les utilisateurs, sans qu'aucune release ne soit decidee. `main`
# redevient donc une branche d'integration, et PUBLIER est un acte explicite : creer la
# release. Qui veut suivre la pointe tire `:edge` en connaissance de cause.
#
# Corollaire : ne jamais remettre `enable={{is_default_branch}}` sur `latest`. Cette
# condition est fausse sur une ref de tag — c'est d'ailleurs pour ca qu'avant ce
# changement, une release ne posait PAS `latest` malgre ce que disait ce commentaire ;
# seul le push de `main` qui la precedait le faisait.
#
# (On declenche sur l'evenement `release` plutot que `push: tags` : les releases de ce
# depot sont creees via l'API GitHub, qui n'emet pas toujours un push de tag.)
#
# GHCR exige un nom d'image en MINUSCULES ; le repo contient des majuscules
# (WicaebethTheo) -> on force le lowercase via ${GITHUB_REPOSITORY,,}.
name: Publish image (GHCR)

on:
  push:
    branches: [main]
    # Un commit qui ne touche QUE de la doc ne reconstruit pas l'image (rien dans
    # l'image ne change). Les releases reconstruisent toujours (pas de filtre).
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "docker-compose*.yml"
      - "LICENSE"
      - ".gitignore"
  release:
    types: [published]
  workflow_dispatch:

# Deux pushes rapproches sur main : seul le dernier compte (le `latest` du premier
# serait immediatement remplace) -> on annule le run en cours. Les releases, elles,
# ne s'annulent JAMAIS : chaque tag semver doit etre publie meme si un autre run
# tourne (leurs refs forment de toute facon des groupes distincts).
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Porte qualite AVANT publication : memes verifications que ci.yml (ruff + pytest).
  # Sans elle, un push casse sur main devenait directement le `latest` public tire
  # par tous les deploiements (Portainer, docker run, one-liner curl|bash).
  test:
    runs-on: ubuntu-latest
    # PostgreSQL est la SEULE base supportee : sans serveur, la suite entiere echoue des la
    # premiere fixture. Meme majeure que l'image livree (cf. docker-compose.yml), pour que
    # la CI exerce ce que l'exploitant fait tourner. Port 55432 = defaut de tests/conftest.py.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm
          POSTGRES_DB: itsm
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://itsm:itsm@localhost:55432/itsm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # `pg_dump` sert aux tests de sauvegarde (tests/unit/test_backup.py), qui dumpent une
      # vraie base. Le client doit etre au moins aussi recent que le serveur, sinon pg_dump
      # refuse de le dumper — d'ou la majeure explicite plutot que le client de la distro
      # (ubuntu-latest livre du 16), et d'ou le depot PGDG.
      # ⚠️ BLOQUANT, plus de `continue-on-error`. Il rendait cette etape decorative : si le
      # paquet manquait, les tests de sauvegarde s'ignoraient et la CI restait verte sans
      # avoir verifie une seule fois le contrat le plus cher a rater. Un garde-fou qui peut
      # s'auto-neutraliser n'en est pas un — et `tests/unit/test_backup.py` refuse desormais
      # de s'ignorer quand la variable CI est presente.
      - name: Client PostgreSQL 17 (aligne sur l'image livree)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc]" \
            "https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version
      # setup-uv plutot que `pip install uv` : version geree par l'action + cache uv
      # automatique (cle sur uv.lock). Coherent avec ci.yml.
      # Version EXACTE obligatoire (`@v9.0.0`, pas `@v9`) : cette action ne publie
      # plus de tag majeur mobile depuis sa v8. Cf. commentaire detaille dans ci.yml.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install deps (uv.lock fige)
        run: uv sync --frozen --all-extras
      - name: ruff
        run: uv run ruff check src tests
      - name: pytest
        run: uv run pytest -q

  build-and-push:
    # Rien ne part sur GHCR si les tests echouent.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nom d'image en minuscules (GHCR l'exige)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: QEMU (cross-build arm64)
        uses: docker/setup-qemu-action@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags / labels (semver + latest + sha)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` UNIQUEMENT sur une release publiee : c'est le tag que tire
            # `docker compose pull`, il ne doit bouger que sur une decision de publication.
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            # La pointe de `main`, pour qui veut suivre le developpement en connaissance
            # de cause (jamais tiree par defaut par un deploiement).
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}

      # Smoke test AVANT publication : on construit l'image amd64 et on la charge
      # dans le daemon local (`load: true`), puis on la BOOTE reellement. Le cache
      # gha est alimente ici -> le build multi-arch final ne refait que l'arm64.
      - name: Build amd64 (image de smoke, chargee localement)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: itsm-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ce que le build seul ne prouve pas : migrations Alembic OK, uvicorn repond,
      # amorcage admin au boot effectif (contrat du deploiement pull-only — sans lui,
      # la console demarre verrouillee). Si ca casse, rien n'est publie.
      # L'image ne boote plus SANS BASE : on lui en fournit une, sur un reseau dedie et a
      # la majeure exacte de celle des composes.
      - name: Smoke test (boot + /health + /api/status + amorcage admin + sauvegarde)
        run: |
          set -euo pipefail
          nettoyer() { docker rm -f itsm-smoke itsm-smoke-pg >/dev/null 2>&1 || true
                       docker network rm itsm-smoke-net >/dev/null 2>&1 || true; }
          trap nettoyer EXIT

          docker network create itsm-smoke-net
          docker run -d --name itsm-smoke-pg --network itsm-smoke-net \
            -e POSTGRES_USER=itsm -e POSTGRES_PASSWORD=itsm -e POSTGRES_DB=itsm \
            --health-cmd "pg_isready -U itsm -d itsm" --health-interval 3s --health-retries 20 \
            postgres:17-alpine
          for _ in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' itsm-smoke-pg)" = healthy ] && break
            sleep 2
          done

          docker run -d --name itsm-smoke --network itsm-smoke-net \
            -e ITSM_ADMIN_PASSWORD=smoke-ci-password \
            -e DATABASE_URL=postgresql+psycopg://itsm:itsm@itsm-smoke-pg:5432/itsm \
            -p 8000:8000 itsm-smoke:ci
          # Attente max ~90 s (45 x 2 s) : migrations + demarrage uvicorn.
          ok=""
          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1 \
              && curl -fsS http://localhost:8000/api/status >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          echo "── logs du conteneur ──"
          docker logs itsm-smoke || true
          if [ -z "$ok" ]; then
            echo "::error::smoke test KO : /health ou /api/status injoignable apres ~90 s"
            exit 1
          fi
          # L'amorcage admin doit avoir eu lieu (ou etre idempotent-skippe).
          if ! docker logs itsm-smoke 2>&1 | grep -Eq "compte admin amorcé|admin déjà configuré"; then
            echo "::error::smoke test KO : aucun amorcage admin dans les logs"
            exit 1
          fi
          # La sauvegarde est le contrat le plus facile a casser sans s'en apercevoir :
          # elle depend de `pg_dump`/`pg_restore` PRESENTS DANS L'IMAGE. On la lance donc
          # pour de vrai — c'est aussi la seule verification du chemin pull-only.
          if ! docker exec itsm-smoke python -m itsm_modern_ai.backup; then
            echo "::error::smoke test KO : la sauvegarde livree dans l'image a echoue"
            exit 1
          fi

      # Publication : uniquement si test + smoke sont passes. Le cache gha rempli
      # par le smoke rend la part amd64 quasi instantanee.
      - name: Build & push multi-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
