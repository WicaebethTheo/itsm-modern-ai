# CI du dépôt — porte de qualité de TOUTE PR (GitHub est désormais le seul forge de ce
# projet, cf. CLAUDE.md). Couvre : ruff + pytest, lint/typecheck/tests/build frontend,
# migrations Alembic, et constructibilité de l'image. Les scans de dépendances vivent
# dans `security-audit.yml`, les secrets dans `secret-scan.yml`, CodeQL dans `codeql.yml`.
#
# Le job backend tourne sur DEUX interpréteurs : 3.14 (celui de l'image livrée) et 3.13
# (le plancher déclaré par `requires-python`). Sans la seconde jambe, le plancher ne serait
# plus exercé nulle part et une dépendance abandonnant 3.13 casserait les installs source
# en silence.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur la même branche/PR rend le run en cours obsolète : on
# l'annule (économise les minutes de runner, feedback plus vite sur le dernier état).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      # DEUX interpréteurs, et c'est délibéré :
      #   - 3.14 = celui de l'image livrée (`Dockerfile`), donc ce qui tourne en prod ;
      #   - 3.13 = le plancher déclaré par `requires-python` dans pyproject.
      # Sans la seconde jambe, le plancher ne serait exercé NULLE PART : une dépendance
      # abandonnant les roues 3.13, ou de la syntaxe 3.14-only glissée dans `src/`,
      # casserait toutes les installations depuis les sources sans que rien ne le voie.
      # Si l'on décide un jour d'abandonner 3.13, il faut monter `requires-python`
      # AVANT de retirer cette jambe — pas l'inverse.
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13"]
    # PostgreSQL est la SEULE base supportée : la suite ne peut plus tourner « à sec ».
    # `tests/conftest.py` crée un SCHÉMA jetable par test sur ce serveur — pas une base
    # par test, qui coûterait bien plus cher pour la même isolation.
    # ⚠️ MAJEURE 17 OBLIGATOIRE, et pas « celle qui traîne » : c'est celle des composes
    # (`postgres:17-alpine`) et du client embarqué dans l'image (`postgresql-client-17`).
    # Tester sur une autre majeure reviendrait à valider une combinaison que le produit ne
    # livre pas — et les tests de sauvegarde y seraient FAUX (un `pg_restore 17` pointé sur
    # un serveur 16 échoue sur `SET transaction_timeout`). Égalité verrouillée par
    # `tests/unit/test_deployment_files.py::test_la_majeure_postgres_de_la_ci_suit_celle_du_produit`.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm
          POSTGRES_DB: itsm
        ports: ["5432:5432"]
        # Sans healthcheck, les premières connexions partent avant que le serveur
        # n'écoute : la suite échoue par intermittence, sur une cause qui n'a rien à
        # voir avec la PR. `--health-*` retarde le job jusqu'à `pg_isready`.
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Lu par `tests/conftest.py`. Le défaut local vise le port 55432 (serveur de dev
      # décalé) ; ici le service publie sur le 5432 standard du runner.
      TEST_DATABASE_URL: postgresql+psycopg://itsm:itsm@localhost:5432/itsm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # ⚠️ SANS CETTE ÉTAPE, LES TESTS DE SAUVEGARDE NE TOURNENT PAS. `tests/unit/test_backup.py`
      # dumpe une vraie base avec le `pg_dump` du RUNNER ; celui d'ubuntu-latest est en 16,
      # or `pg_dump` refuse de dumper un serveur d'une majeure supérieure (le service ci-dessus
      # est en 17). Les tests s'ignoraient donc — mesuré : « 577 passed, 8 skipped », couverture
      # toujours au-dessus du cliquet, rien de rouge. Autrement dit : la CI pouvait être verte
      # sans avoir vérifié une seule fois que la sauvegarde ne ment pas. Le client vient du
      # dépôt PGDG (les dépôts Ubuntu ne portent pas la 17), et l'étape est BLOQUANTE : pas de
      # `continue-on-error`, sans quoi on retomberait exactement dans le même trou.
      - name: Client PostgreSQL 17 (aligné sur le serveur et sur l'image livrée)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc]" \
            "https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version
      # setup-uv plutôt que `pip install uv` : version gérée par l'action + cache uv
      # automatique (clé sur uv.lock). Cohérent avec docker-publish.yml.
      # Épinglage sur la version EXACTE (`@v9.0.0`, pas `@v9`) : depuis sa v8 cette
      # action ne publie plus de tag majeur/mineur mobile (durcissement chaîne
      # d'appro., cf. incident tj-actions) — `@v9` ne résoudrait tout simplement pas.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install deps (uv.lock figé)
        run: uv sync --frozen --all-extras
      - name: ruff
        run: uv run ruff check src tests
      # `--cov` sans argument : la source et le seuil viennent de `pyproject.toml`
      # (`[tool.coverage]`), pour que `pytest --cov` en local mesure EXACTEMENT la même
      # chose que la CI. Un seuil qui ne vaut qu'en CI se découvre au moment où il casse.
      - name: pytest (+ seuil de couverture)
        run: uv run pytest -q --cov

  # Migrations Alembic — le job le plus rentable de cette CI. Une révision cassée ne se
  # voit PAS dans pytest (les tests créent le schéma via `SQLModel.create_all`, pas via
  # Alembic) : elle ne se manifeste qu'au `docker compose up` de l'exploitant, où
  # l'entrypoint boucle sur « Can't locate revision identified by … » et où la console
  # ne démarre jamais. On éprouve donc les trois chemins réels :
  #   1. base VIDE  -> `upgrade head` (première installation) ;
  #   2. base PEUPLÉE -> `upgrade head` (mise à jour d'une instance existante : c'est là
  #      qu'un `add_column` NOT NULL sans `server_default` explose) ;
  #   3. aller-retour `downgrade -1` puis `upgrade head` (le chemin de `--rollback`).
  migrations:
    runs-on: ubuntu-latest
    # Même majeure que le job `backend`, les composes et le client de l'image : cf. le
    # commentaire ci-dessus. Une migration validée sur une autre majeure ne prouve rien
    # du chemin réel de l'exploitant.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm
          POSTGRES_DB: itsm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Deux BASES distinctes (et non deux schémas) : `alembic_version` vit dans la base,
      # et les deux scénarios doivent avoir chacun leur propre historique de révisions.
      # `DATABASE_URL` (lu par Alembic via Settings) porte le driver ; les blocs psycopg
      # ci-dessous se connectent en direct, d'où les deux formes.
      PG_ADMIN_URL: postgresql://itsm:itsm@localhost:5432/postgres
      PG_SEEDED_URL: postgresql://itsm:itsm@localhost:5432/ci_seeded
      URL_VIDE: postgresql+psycopg://itsm:itsm@localhost:5432/ci_empty
      URL_PEUPLEE: postgresql+psycopg://itsm:itsm@localhost:5432/ci_seeded
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install deps (uv.lock figé)
        run: uv sync --frozen --all-extras
      # Création via psycopg (déjà installé, c'est le driver du produit) plutôt que via
      # `psql` : aucune hypothèse sur les clients présents dans l'image du runner.
      - name: Créer les deux bases du scénario
        run: |
          uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["PG_ADMIN_URL"], autocommit=True) as cx:
              for base in ("ci_empty", "ci_seeded"):
                  cx.execute(f"CREATE DATABASE {base}")
          print("bases ci_empty et ci_seeded créées")
          PY
      - name: upgrade head sur base vide
        env:
          DATABASE_URL: ${{ env.URL_VIDE }}
        run: uv run alembic upgrade head
      - name: upgrade head sur base PEUPLÉE + aller-retour
        env:
          DATABASE_URL: ${{ env.URL_PEUPLEE }}
        run: |
          set -euo pipefail
          # On s'arrête une révision AVANT la tête, on peuple, puis on migre : c'est le
          # scénario d'un exploitant qui fait `docker compose pull` avec des données.
          uv run alembic upgrade head-1
          # Insertion en SQL BRUT, pas via les modèles SQLModel : le code décrit le schéma
          # à `head`, la base est ici à `head-1`. Passer par l'ORM ferait échouer ce job
          # dès qu'une migration ajoute une colonne — pour une raison sans rapport avec ce
          # qu'on veut prouver (les données survivent-elles à la migration ?).
          # Valeurs passées en PARAMÈTRES : PostgreSQL n'accepte pas `0`/`1` pour un
          # booléen ni un horodatage sans fuseau sur un `timestamptz`, contrairement à
          # SQLite qui avalait les deux — c'est précisément ce laxisme qu'on quitte.
          uv run python - <<'PY'
          import datetime, os, psycopg
          with psycopg.connect(os.environ["PG_SEEDED_URL"], autocommit=True) as cx:
              cx.execute(
                  "INSERT INTO decisions"
                  " (ticket_id, ts, subject, accepted, reason, glpi_link, annotation, mode, applied)"
                  " VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s)",
                  (1, datetime.datetime(2026, 1, 1, tzinfo=datetime.UTC), "Ticket historique",
                   False, "low_confidence", "", "", "suggestion", False),
              )
          print("base peuplée avant migration")
          PY
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
      # Relecture en direct (sans Alembic) : on vérifie la BASE, pas ce que le code croit.
      - name: Les données ont survécu à la migration
        run: |
          uv run python - <<'PY'
          import os, sys, psycopg
          with psycopg.connect(os.environ["PG_SEEDED_URL"]) as cx:
              sujets = [r[0] for r in cx.execute("SELECT subject FROM decisions")]
          if sujets != ["Ticket historique"]:
              sys.exit(f"données perdues par la migration : {sujets!r}")
          print("données préservées :", sujets)
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 = LTS active ; aligné avec l'étape `ui` du Dockerfile et
          # `.gitlab-ci.yml` (un seul Node de référence, pas de drift de build).
          node-version: "24"
          # Cache npm intégré (clé sur le lockfile) : `npm ci` repart tiède.
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `test:coverage` et non `test` : seuils et périmètre de mesure vivent dans
      # `vitest.config.ts`, donc la commande locale mesure la même chose que la CI.
      - run: npm run test:coverage
      - run: npm run build

  # Prouve que l'image Docker est constructible AVANT merge : la publication GHCR
  # (docker-publish.yml) ne tourne que sur main — sans ce job, une PR pouvait casser
  # le Dockerfile sans que rien ne le signale avant d'atteindre `latest`. Build
  # amd64 seul, SANS push ; le cache gha est partagé avec docker-publish.yml, dont
  # le build de publication repart donc tiède.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (amd64, sans push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
