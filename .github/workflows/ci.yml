# CI publique (GitHub) — porte minimale pour les PR sur le mirror : ruff + pytest +
# build frontend. La CI complète (e2e Playwright, scans de dépendances) reste sur
# GitLab (.gitlab-ci.yml, strippé du mirror). Le job backend tourne sur DEUX
# interpréteurs : 3.14 (celui de l'image livrée) et 3.13 (le plancher déclaré par
# `requires-python`). Sans la seconde jambe, le plancher ne serait plus exercé nulle
# part et une dépendance abandonnant 3.13 casserait les installs source en silence.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur la même branche/PR rend le run en cours obsolète : on
# l'annule (économise les minutes de runner, feedback plus vite sur le dernier état).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      # DEUX interpréteurs, et c'est délibéré :
      #   - 3.14 = celui de l'image livrée (`Dockerfile`), donc ce qui tourne en prod ;
      #   - 3.13 = le plancher déclaré par `requires-python` dans pyproject.
      # Sans la seconde jambe, le plancher ne serait exercé NULLE PART : une dépendance
      # abandonnant les roues 3.13, ou de la syntaxe 3.14-only glissée dans `src/`,
      # casserait toutes les installations depuis les sources sans que rien ne le voie.
      # Si l'on décide un jour d'abandonner 3.13, il faut monter `requires-python`
      # AVANT de retirer cette jambe — pas l'inverse.
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # setup-uv plutôt que `pip install uv` : version gérée par l'action + cache uv
      # automatique (clé sur uv.lock). Cohérent avec docker-publish.yml.
      # Épinglage sur la version EXACTE (`@v9.0.0`, pas `@v9`) : depuis sa v8 cette
      # action ne publie plus de tag majeur/mineur mobile (durcissement chaîne
      # d'appro., cf. incident tj-actions) — `@v9` ne résoudrait tout simplement pas.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install deps (uv.lock figé)
        run: uv sync --frozen --all-extras
      - name: ruff
        run: uv run ruff check src tests
      - name: pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 = LTS active ; aligné avec l'étape `ui` du Dockerfile et
          # `.gitlab-ci.yml` (un seul Node de référence, pas de drift de build).
          node-version: "24"
          # Cache npm intégré (clé sur le lockfile) : `npm ci` repart tiède.
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Prouve que l'image Docker est constructible AVANT merge : la publication GHCR
  # (docker-publish.yml) ne tourne que sur main — sans ce job, une PR pouvait casser
  # le Dockerfile sans que rien ne le signale avant d'atteindre `latest`. Build
  # amd64 seul, SANS push ; le cache gha est partagé avec docker-publish.yml, dont
  # le build de publication repart donc tiède.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (amd64, sans push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
