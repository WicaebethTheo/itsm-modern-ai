# Configuration gitleaks — scan de secrets (cf. .github/workflows/secret-scan.yml).
#
# Principe : on N'AFFAIBLIT PAS la détection. `useDefault = true` reprend l'intégralité
# du jeu de règles embarqué dans le binaire gitleaks (AWS, GCP, GitLab PAT, GitHub PAT,
# clés privées, JWT, etc.) ; on se contente d'ajouter des exceptions *chirurgicales*
# pour les faux positifs connus de ce dépôt.
#
# ⚠️ SYNTAXE : allowlist au SINGULIER (`[allowlist]`), délibérément. Le tableau global
# `[[allowlists]]` (pluriel) n'est interprété que par les gitleaks récents ; or
# `gitleaks/gitleaks-action@v3` embarque la **8.24.3**, qui l'ignore SILENCIEUSEMENT —
# la CI trouvait alors des « fuites » sur les fixtures de test alors qu'un test local
# avec un binaire plus récent passait au vert. Le singulier fonctionne sur les deux.
# Vérifié sur 8.24.3 (version de l'action) ET 8.30.1 (dernière), avec test négatif.
[extend]
useDefault = true

# ── Allowlist globale ─────────────────────────────────────────────────────────
# `regexTarget = "match"` : l'exception porte sur la VALEUR détectée, jamais sur un
# chemin de fichier (sauf les lockfiles, cf. plus bas). C'est volontaire : exclure
# `tests/**` en bloc créerait un angle mort permanent — un vrai secret collé dans une
# fixture passerait inaperçu. Ici seules les chaînes EXACTES ci-dessous sont tolérées,
# où qu'elles apparaissent ; n'importe quelle autre clé dans les mêmes fichiers reste
# détectée et fait rougir le job (test négatif à l'appui).
[allowlist]
description = "Faux positifs connus : fixtures de test et hashes d'intégrité des lockfiles."
regexTarget = "match"
regexes = [
  # Placeholder officiel de la documentation AWS. Fixture de tests/unit/test_masking.py,
  # qui vérifie que domain/masking.py remplace bien une clé cloud par [CLOUD_KEY].
  # Publié tel quel par AWS dans ses propres exemples — ce n'est l'identifiant de personne.
  '''AKIAIOSFODNN7EXAMPLE''',
  # Secret access key compagne du même exemple AWS. Absente du dépôt aujourd'hui ;
  # présente ici pour qu'un futur test de la paire complète ne fasse pas rougir le job.
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  # Paire Ed25519 DÉDIÉE AUX TESTS (tests/unit/test_licensing.py). La clé privée y vit en
  # clair par conception : elle ne signe que des jetons vérifiés contre TEST_PUBLIC_KEY_HEX.
  # Vérifié : sa clé publique dérivée est bien c56015ec… (clé de test) et NON
  # 0d9cf5c9… (licensing.PUBLISHER_PUBLIC_KEY_HEX, production) — elle ne permet donc pas
  # de forger une licence Supporter valide. La vraie clé de signature ne quitte jamais le
  # dépôt privé de signature. Toute AUTRE clé hex de 64 caractères reste détectée.
  '''6207e5305adef0b557a9e568dbefd1b97094a8bdb44996e6785591b6250f7c85''',
  '''c56015ecbbd074740f2adf93a6c0024336d329982853b7973d006fb8168d6bb6''',
  # Jeton de licence VOLONTAIREMENT invalide de tests/integration/test_license_api.py
  # (vérifie qu'une clé invalide est rejetée). Motif volontairement EXACT et non
  # générique (`itsm-lic\.v1\..*`) : un vrai jeton de licence collé quelque part doit
  # continuer à être signalé.
  '''itsm-lic\.v1\.bidon\.bidon''',
]
# Lockfiles : `uv.lock` et `frontend/package-lock.json` sont truffés de hashes
# sha256/sha512 en base64 qui déclenchent les règles « generic high entropy ». Ce sont
# des empreintes d'artefacts publics, jamais des secrets — et ils sont régénérés par
# l'outillage, donc impossibles à « corriger » ligne à ligne.
paths = [
  '''(^|/)uv\.lock$''',
  '''(^|/)package-lock\.json$''',
]
